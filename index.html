<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Luck Rush</title>

<style>

@font-face {
  font-family: 'Tangba';

  src:
    url('./Fonts/woff/Tangba11.woff2') format('woff2'),
    url('./Fonts/woff/Tangba11.woff') format('woff');
}

body {
  background: #111;
  color: white;
  font-family: 'Tangba';
  text-align: center;
  margin: 0;
  padding: 4vw;
}

/* 전체 영역 */

.container {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
}

/* 제목 */

h1 {
  color: hotpink;
  font-weight: normal;
  font-size: clamp(3rem, 8vw, 5rem);
  text-shadow:
    0 0 15px hotpink;
  margin-top: 2vh;
}

/* 소제목 */

h2 {
  font-weight: normal;
  font-size: clamp(1.8rem, 4vw, 3rem);
  margin-top: 6vh;
}

/* 메뉴 */

.menu,
.game {
  margin-top: 5vh;
}

/* 버튼 */

button {
  background: hotpink;
  color: white;
  border: none;
  border-radius: 20px;
  padding: 20px;
  margin: 10px;
  width: min(80vw, 260px);
  cursor: pointer;
  font-family: 'Tangba';
  font-size: clamp(1.2rem, 2vw, 1.8rem);
  transition: 0.2s;
}

/* 버튼 호버 */

button:hover {
  opacity: 0.9;
  transform: scale(1.03);
  box-shadow:
    0 0 20px hotpink;
}

.back-btn {
  background: none;
  border: none;
  color: hotpink;
  font-size: 1rem;
  width: auto;
  padding: 0;
  margin-bottom: 20px;
  cursor: pointer;
}


.menu {
  background: #1b1b1b;
  border: 2px solid hotpink;
  border-radius: 30px;
  padding: 30px;
  box-shadow:
    0 0 30px rgba(255, 105, 180, 0.3);
}



/* 결과 */

#result {
  font-size: clamp(1.5rem, 4vw, 2.5rem);
  margin-top: 4vh;
}

/* 코인 */

#money {
  font-size: clamp(1.3rem, 3vw, 2rem);
  margin-top: 3vh;
}

/* 설명 */

p {
  font-size: clamp(1rem, 2vw, 1.4rem);
}

/* 모바일 대응 */

@media (max-width: 768px) {

  body {
    padding: 8vw;
  }

  button {
    width: 85vw;
    padding: 18px;
  }

}

</style>
</head>

<body>

<div class="container">

  <h1>LUCK RUSH</h1>

  <div id="money">
    보유 칩 <span id="coinText">1000</span>
  </div>

  <!-- 시작 화면 -->

  <div class="menu" id="menu">

    <h2>게임 선택</h2>

    <button onclick="openGame('coinflip')">
      코인 플립
    </button>

    <button onclick="alert('준비 중!')">
      슬롯머신
    </button>

    <button onclick="alert('준비 중!')">
      카드 게임
    </button>

  </div>

  <!-- 코인 플립 -->

  <div class="game" id="coinflip" style="display:none;">

    <h2>코인 플립</h2>

    <p>100 코인을 배팅합니다.</p>

    <button onclick="flipCoin('front')">
      앞면
    </button>

    <button onclick="flipCoin('back')">
      뒷면
    </button>

    <br><br>


    <button class="back-btn" onclick="goMenu()">
    ← 뒤로가기
    </button>


    <div id="result"></div>

  </div>

</div>

<script>

let coin = 1000;

function updateCoin() {

  document.getElementById("coinText").innerText = coin;
}

function openGame(gameId) {

  document.getElementById("menu").style.display = "none";

  document.getElementById(gameId).style.display = "block";
}

function goMenu() {

  document.getElementById("menu").style.display = "block";

  document.getElementById("coinflip").style.display = "none";

  document.getElementById("result").innerText = "";
}

function flipCoin(choice) {

  let result = Math.random() < 0.5
    ? "front"
    : "back";

  if (choice === result) {

    coin += 100;

    document.getElementById("result").innerText =
      "성공 +100";

  } else {

    coin -= 100;

    document.getElementById("result").innerText =
      "실패 -100";
  }

  updateCoin();
}

</script>

</body>
</html>
