<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Luck Rush</title>
<style>

@font-face {
  font-family: 'Tangba';
  src:
    url('./Fonts/woff/Tangba11.woff2') format('woff2'),
    url('./Fonts/woff/Tangba11.woff') format('woff');
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #111;
  color: white;
  font-family: 'Tangba', sans-serif;
  text-align: center;
  margin: 0;
  padding: 4vw;
}

.container {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
}

h1 {
  color: hotpink;
  font-weight: normal;
  font-size: clamp(3rem, 8vw, 5rem);
  text-shadow: 0 0 15px hotpink;
  margin-top: 2vh;
}

h2 {
  font-weight: normal;
  font-size: clamp(1.8rem, 4vw, 3rem);
  margin-top: 0;
  margin-bottom: 3vh;
}

/* 칩 바 */
#money {
  font-size: clamp(1.3rem, 3vw, 2rem);
  margin-top: 3vh;
  margin-bottom: 3vh;
}

#money.debt {
  color: #ff3355;
}

/* ── 화면 전환 ── */
.screen { display: none; }
.screen.active { display: block; }

/* ── 메뉴 ── */
.menu-box {
  background: #1b1b1b;
  border: 2px solid hotpink;
  border-radius: 30px;
  padding: 30px;
  box-shadow: 0 0 30px rgba(255,105,180,0.3);
  margin-top: 2vh;
}

/* ── 버튼 공통 ── */
button {
  background: hotpink;
  color: white;
  border: none;
  border-radius: 20px;
  padding: 20px;
  margin: 10px;
  width: min(80vw, 260px);
  cursor: pointer;
  font-family: 'Tangba', sans-serif;
  font-size: clamp(1.2rem, 2vw, 1.8rem);
  transition: 0.2s;
}

button:hover:not(:disabled) {
  opacity: 0.9;
  transform: scale(1.03);
  box-shadow: 0 0 20px hotpink;
}

button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.back-btn {
  background: none;
  border: none;
  color: hotpink;
  font-size: clamp(1rem, 2vw, 1.3rem);
  width: auto;
  padding: 0;
  margin-bottom: 3vh;
  cursor: pointer;
  display: block;
}

.back-btn:hover {
  opacity: 0.7;
  transform: none;
  box-shadow: none;
}

/* ── 빚 경고 배너 ── */
.debt-banner {
  display: none;
  background: #ff2244;
  color: #fff;
  border-radius: 12px;
  padding: 14px 20px;
  font-size: clamp(1rem, 2vw, 1.3rem);
  margin-bottom: 3vh;
}

.debt-banner.show { display: block; }

/* ── 코인플립 화면 (박스 없음) ── */
#screen-coinflip {
  padding-top: 1vh;
}

p.chance {
  font-size: clamp(1rem, 2vw, 1.4rem);
  color: #aaa;
  margin-bottom: 1vh;
}

p.bet-row {
  font-size: clamp(1rem, 2vw, 1.4rem);
  color: #aaa;
  margin-bottom: 3vh;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.bet-input {
  background: #1b1b1b;
  border: 1.5px solid #444;
  border-radius: 8px;
  color: hotpink;
  font-family: 'Tangba', sans-serif;
  font-size: clamp(1rem, 2vw, 1.4rem);
  padding: 6px 12px;
  width: 110px;
  text-align: center;
  outline: none;
  transition: border-color 0.2s;
}

.bet-input:focus { border-color: hotpink; }

/* 동전 */
.coin-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 2vh auto 3vh;
  min-height: 120px;
  justify-content: center;
}

.lr-coin {
  width: 90px;
  height: 90px;
  perspective: 500px;
}

.lr-coin-inner {
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  position: relative;
}

.lr-coin-face {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  backface-visibility: hidden;
}

/* ★ 앞면 — 직접 꾸미세요 */
.lr-coin-front {
  background: #1e1e28;
  border: 3px solid hotpink;
  font-size: 1rem;
  color: hotpink;
}

/* ★ 뒷면 — 직접 꾸미세요 */
.lr-coin-back {
  background: #1e1e28;
  border: 3px solid #ff69b4;
  font-size: 1rem;
  color: #ff69b4;
  transform: rotateY(180deg);
}

.drumroll-text {
  font-size: clamp(1rem, 2vw, 1.3rem);
  color: hotpink;
  margin-top: 12px;
  letter-spacing: 2px;
  min-height: 1.6rem;
}

/* 결과 */
#result {
  font-size: clamp(1.5rem, 4vw, 2.5rem);
  margin-top: 3vh;
  min-height: 2rem;
}

.win  { color: rgb(94, 255, 94); }
.lose { color: #ff4444; }

/* 실패 플래시 */
.flash-overlay {
  position: fixed;
  inset: 0;
  background: rgba(255,30,30,0);
  pointer-events: none;
  transition: background 0.08s;
  z-index: 999;
}

/* 팡파레 캔버스 */
#confettiCanvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 998;
}

@media (max-width: 768px) {
  body { padding: 8vw; }
  button { width: 85vw; padding: 18px; }
}

</style>
</head>
<body>

<div class="container">

  <h1>LUCK RUSH</h1>

  <div id="money">
    보유 칩 <span id="coinText">1000</span>
  </div>

  <!-- ════════════════════════════
       화면 1 : 메뉴
  ════════════════════════════ -->
  <div class="screen active" id="screen-menu">

    <div class="menu-box">
      <h2>게임 선택</h2>

      <button id="menuBtnCoinflip" onclick="openGame('coinflip')">
        코인 플립
      </button>

      <button onclick="alert('준비 중!')">
        슬롯머신
      </button>

      <button onclick="alert('준비 중!')">
        카드 게임
      </button>
    </div>

  </div>

  <!-- ════════════════════════════
       화면 2 : 코인 플립
  ════════════════════════════ -->
  <div class="screen" id="screen-coinflip">

    <button class="back-btn" onclick="goMenu()">← 뒤로가기</button>

    <h2>코인 플립</h2>

    <!-- 빚 경고 -->
    <div class="debt-banner" id="debtBanner">
      칩이 부족해서 게임을 할 수 없어요.<br>노동하세요!
    </div>

    <p class="chance">승률 50% · 배당 2배</p>

    <p class="bet-row">
      배팅
      <input class="bet-input" id="betInput" type="number" min="1" value="100" />
      칩
    </p>

    <div class="coin-area">
      <div class="lr-coin">
        <div class="lr-coin-inner" id="coinInner">
          <!-- ★ 앞면 내용 — 원하는 텍스트/이미지로 교체하세요 -->
          <div class="lr-coin-face lr-coin-front">앞</div>
          <!-- ★ 뒷면 내용 — 원하는 텍스트/이미지로 교체하세요 -->
          <div class="lr-coin-face lr-coin-back">뒤</div>
        </div>
      </div>
      <div class="drumroll-text" id="drumText"></div>
    </div>

    <button id="btnFront" onclick="flip('front')">앞면</button>
    <button id="btnBack"  onclick="flip('back')">뒷면</button>

    <div id="result"></div>

  </div>

</div><!-- /container -->

<!-- 전역 오버레이 -->
<div class="flash-overlay" id="flashOverlay"></div>
<canvas id="confettiCanvas"></canvas>

<script>
(function () {

  const STORAGE_KEY = 'luckrush_coin_v2';
  const BET_KEY     = 'luckrush_bet_v2';

  /* ── 저장/불러오기 ── */
  let coin = (() => {
    try { const v = localStorage.getItem(STORAGE_KEY); return v !== null ? Number(v) : 1000; }
    catch (e) { return 1000; }
  })();

  let betAmt = (() => {
    try { const v = localStorage.getItem(BET_KEY); return v !== null ? Math.max(1, Number(v)) : 100; }
    catch (e) { return 100; }
  })();

  let spinning = false;

  /* DOM */
  const coinText     = document.getElementById('coinText');
  const moneyEl      = document.getElementById('money');
  const betInput     = document.getElementById('betInput');
  const coinInner    = document.getElementById('coinInner');
  const drumText     = document.getElementById('drumText');
  const resultEl     = document.getElementById('result');
  const btnFront     = document.getElementById('btnFront');
  const btnBack      = document.getElementById('btnBack');
  const flashOverlay = document.getElementById('flashOverlay');
  const confettiCanvas = document.getElementById('confettiCanvas');
  const debtBanner   = document.getElementById('debtBanner');
  const menuBtnCoinflip = document.getElementById('menuBtnCoinflip');

  betInput.value = betAmt;

  /* ── 칩 UI 업데이트 ── */
  function updateCoinUI() {
    const abs = Math.abs(coin).toLocaleString();
    coinText.textContent = coin < 0 ? '-' + abs + ' (빚)' : abs;
    moneyEl.className = coin < 0 ? 'debt' : '';

    /* 메뉴 버튼: 빚이면 비활성 */
    menuBtnCoinflip.disabled = coin < 0;
  }

  function saveCoin() {
    try { localStorage.setItem(STORAGE_KEY, coin); } catch (e) {}
  }

  updateCoinUI();

  /* ── 배팅 금액 저장 ── */
  betInput.addEventListener('change', () => {
    betAmt = Math.max(1, parseInt(betInput.value) || 1);
    betInput.value = betAmt;
    try { localStorage.setItem(BET_KEY, betAmt); } catch (e) {}
  });

  /* ── 화면 전환 ── */
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + id).classList.add('active');
  }

  window.openGame = function (gameId) {
    resultEl.textContent = '';
    resultEl.className   = '';
    drumText.textContent = '';
    coinInner.style.transform = 'rotateY(0deg)';

    /* 빚이면 배너 표시 + 버튼 비활성 */
    const inDebt = coin < 0;
    debtBanner.className = inDebt ? 'debt-banner show' : 'debt-banner';
    btnFront.disabled = inDebt;
    btnBack.disabled  = inDebt;

    showScreen(gameId);
  };

  window.goMenu = function () {
    showScreen('menu');
    updateCoinUI(); /* 메뉴 버튼 상태 갱신 */
  };

  /* ── 두구두구 ── */
  const drumMessages = ['두구', '두구두구', '두구두구'];

  /* ── 플립 ── */
  window.flip = function (choice) {
    if (spinning || coin < 0) return;
    const bet = Math.max(1, parseInt(betInput.value) || 1);
    betAmt = bet;
    try { localStorage.setItem(BET_KEY, betAmt); } catch (e) {}

    spinning = true;
    btnFront.disabled = true;
    btnBack.disabled  = true;
    resultEl.textContent = '';
    resultEl.className   = '';

    let rotY = 0;
    const spinInterval = setInterval(() => {
      rotY += 60;
      coinInner.style.transform = `rotateY(${rotY}deg)`;
    }, 80);

    let drumIdx = 0;
    const msgInterval = setInterval(() => {
      if (drumIdx < drumMessages.length) drumText.textContent = drumMessages[drumIdx++];
    }, 280);

    setTimeout(() => {
      clearInterval(spinInterval);
      clearInterval(msgInterval);
      drumText.textContent = '';

      const outcome = Math.random() < 0.5 ? 'front' : 'back';
      const won     = choice === outcome;

      coinInner.style.transform = outcome === 'front' ? 'rotateY(0deg)' : 'rotateY(180deg)';

      if (won) {
        coin += bet;
        saveCoin();
        updateCoinUI();
        resultEl.textContent = `성공! +${bet.toLocaleString()} ✦`;
        resultEl.className   = 'win';
        launchConfetti();
      } else {
        coin -= bet;
        saveCoin();
        updateCoinUI();
        resultEl.textContent = `실패 -${bet.toLocaleString()}${coin < 0 ? '  (돈 벌러 가!)' : ''}`;
        resultEl.className   = 'lose';
        doFlash();

        /* 실패로 빚이 됐으면 버튼 잠금 + 배너 표시 */
        if (coin < 0) {
          debtBanner.className = 'debt-banner show';
          btnFront.disabled = true;
          btnBack.disabled  = true;
        }
      }

      spinning = false;
      if (coin >= 0) {
        btnFront.disabled = false;
        btnBack.disabled  = false;
      }
    }, 1000);
  };

  /* ── 실패 플래시 ── */
  function doFlash() {
    flashOverlay.style.background = 'rgba(255,30,30,0.35)';
    setTimeout(() => { flashOverlay.style.background = 'rgba(255,30,30,0)';   }, 220);
    setTimeout(() => { flashOverlay.style.background = 'rgba(255,30,30,0.2)'; }, 380);
    setTimeout(() => { flashOverlay.style.background = 'rgba(255,30,30,0)';   }, 540);
  }

  /* ── 팡파레 ── */
  function launchConfetti() {
    const ctx = confettiCanvas.getContext('2d');
    confettiCanvas.width  = window.innerWidth;
    confettiCanvas.height = window.innerHeight;

    const colors = ['#ff69b4','#ff9dcc','#ffb3d9','#ff3388','#ff66aa','#ffcce6'];
    const particles = Array.from({ length: 80 }, () => ({
      x: Math.random() * confettiCanvas.width,
      y: Math.random() * confettiCanvas.height * 0.4,
      r: Math.random() * 5 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 4,
      vy: Math.random() * 3 + 1,
      alpha: 1,
      rot: Math.random() * Math.PI * 2,
      rspeed: (Math.random() - 0.5) * 0.2
    }));

    let frame;
    function draw() {
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      let alive = false;
      particles.forEach(p => {
        if (p.alpha <= 0) return;
        alive = true;
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
        ctx.restore();
        p.x  += p.vx;
        p.y  += p.vy;
        p.vy += 0.08;
        p.rot += p.rspeed;
        if (p.y > confettiCanvas.height * 0.85) p.alpha -= 0.04;
      });
      if (alive) frame = requestAnimationFrame(draw);
      else ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    }
    if (frame) cancelAnimationFrame(frame);
    draw();
  }

})();
</script>
</body>
</html>
