<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Luck Rush</title>

  <style>


@font-face {
  font-family: 'Tangba';

  src:
    url('./Fonts/woff/Tangba11.woff2') format('woff2'),
    url('./Fonts/woff/Tangba11.woff') format('woff');
}

body {
  background: #111;
  color: white;
  font-family: 'Tangba';
  text-align: center;
  margin: 0;
  padding: 4vw;
}

/* 제목 */

h1 {
  color: hotpink;
  font-weight: normal;
  font-size: clamp(2.5rem, 7vw, 5rem);
  text-shadow:
    0 0 15px hotpink;
  margin-top: 2vh;
}

/* 소제목 */

h2 {
  font-weight: normal;
  font-size: clamp(1.5rem, 4vw, 3rem);
  margin-top: 6vh;
}

/* 메뉴 영역 */

.menu,
.game {
  margin-top: 5vh;
}

/* 버튼 */

button {
  background: hotpink;
  color: white;
  border: none;
  border-radius: 1rem;
  padding: 1em 2em;
  margin: 1vh 1vw;
  cursor: pointer;
  font-family: 'Tangba';
  font-size: clamp(1rem, 2vw, 1.5rem);
  transition:
    transform 0.2s,
    opacity 0.2s,
    box-shadow 0.2s;
  min-width: 20vw;
}

/* 버튼 호버 */

button:hover {
  opacity: 0.9;
  transform: scale(1.03);
  box-shadow:
    0 0 20px hotpink;
}

/* 결과 텍스트 */

#result {
  font-size: clamp(1.5rem, 4vw, 2.5rem);
  margin-top: 4vh;
}

/* 코인 텍스트 */

#money {
  font-size: clamp(1.2rem, 3vw, 2rem);
  margin-top: 3vh;
}

/* 모바일 대응 */

@media (max-width: 768px) {

  body {
    padding: 8vw;
  }

  button {
    width: 80vw;
    min-width: unset;
    padding: 1.2em;
    margin-top: 2vh;
  }

}

  </style>
</head>
<body>

  <h1>LUCK GAME</h1>

  <div id="money">
    현재 보유 칩 <span id="coinText">1000</span>
  </div>

  <!-- 시작 화면 -->
  <div class="menu" id="menu">

    <h2>게임 선택</h2>

    <button onclick="openGame('coinflip')">
      코인 플립
    </button>

    <button onclick="alert('준비 중!')">
      슬롯머신
    </button>

    <button onclick="alert('준비 중!')">
      카드 게임
    </button>

  </div>

  <!-- 코인 플립 화면 -->
  <div class="game" id="coinflip" style="display:none;">

    <h2>코인 플립</h2>

    <p>100 코인을 배팅합니다.</p>

    <button onclick="flipCoin('front')">
      앞면
    </button>

    <button onclick="flipCoin('back')">
      뒷면
    </button>

    <br><br>

    <button onclick="goMenu()">
      뒤로가기
    </button>

    <div id="result"></div>

  </div>

  <script>

    let coin = 1000;

    function updateCoin() {
      document.getElementById("coinText").innerText = coin;
    }

    function openGame(gameId) {

      document.getElementById("menu").style.display = "none";

      document.getElementById(gameId).style.display = "block";
    }

    function goMenu() {

      document.getElementById("menu").style.display = "block";

      document.getElementById("coinflip").style.display = "none";

      document.getElementById("result").innerText = "";
    }

    function flipCoin(choice) {

      let result = Math.random() < 0.5 ? "front" : "back";

      if (choice === result) {

        coin += 100;

        document.getElementById("result").innerText =
          "승리! +100";

      } else {

        coin -= 100;

        document.getElementById("result").innerText =
          "패배... -100";
      }

      updateCoin();
    }

  </script>

</body>
</html>
